name: Validate JSON

on:
  push:
    paths:
      - "**/*.json"
      - "src/**"
      - "web-app/**"
      - ".github/workflows/validate-json.yml"
  pull_request:
    paths:
      - "**/*.json"
      - "src/**"
      - "web-app/**"
      - ".github/workflows/validate-json.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check web-app/app.js
          node --check src/core/uuid.js
          node --check src/core/manifest.js
          node --check src/core/validate.js
      - name: Validate repository JSON files
        run: |
          find . -name '*.json' -not -path './.git/*' -print0 | xargs -0 -r -n1 node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" 
